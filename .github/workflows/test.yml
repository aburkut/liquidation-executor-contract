name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

# No FOUNDRY_PROFILE override: foundry.toml has no `ci` profile. Newer forge
# builds silently fell back to `default` when it was set; the pinned build
# refuses to run ("selected profile `ci` does not exist").

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          # Pinned to the build the local gate runs (`forge --version`).
          # Unpinned, the action installs the latest nightly, whose
          # formatter drifted on 2026-09-06 and failed `forge fmt --check`
          # on code that was byte-identical to a green main. A formatter
          # is part of the toolchain; CI and the local gate must share it.
          version: nightly-5e88010a83d1b87b8f4d13058e42a2949d3e9dc0

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        run: forge build --sizes

      - name: Check executor sizes against the EIP-170 threshold
        run: script/check_sizes.sh 24200

      - name: Run Forge tests
        run: forge test -vvv
